appId: com.leafmark.desktop
productName: LeafMark
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  target: nsis
  signAndEditExecutable: false
mac:
  target: dmg
linux:
  target: AppImage
