appId: com.leafmark.desktop
productName: LeafMark
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  target: nsis
  icon: build/icon/leafmark.ico
  signAndEditExecutable: false
mac:
  target: dmg
linux:
  target: AppImage
publish:
  provider: github
  owner: shoushi
  repo: LeafMark
  releaseType: release
